# Configuration d'exemple -- AUCUN SECRET DANS CE FICHIER.
#
# Usage :
#   cp config.example.toml config.toml
# puis ajuster les valeurs. config.toml est exclu du depot par .gitignore.
#
# Toute valeur peut aussi etre passee en ligne de commande, qui gagne sur le
# fichier, lui-meme gagnant sur les valeurs par defaut du code.

[cible]
# Identifiant de cible attribue par le formateur (S01, S17, S24, S61...).
id = "S32"
nom = "Cleveland Museum of Art"
# URL de depart exacte, telle qu'indiquee dans la fiche de cible. Elle sert au
# diagnostic et a l'origine du robots.txt ; le parcours reel, lui, part des
# graines ci-dessous (la recherche passe par /api, interdit -- voir la fiche).
url_depart = "https://www.clevelandart.org/art/collection/search"

[collecte]
# Plafond d'objets, jamais un objectif. La fiche de cible plafonne a 30.
max_objets = 30
# Plafond de fiches visitees. Garde-fou contre un piege a crawler.
max_pages = 60
# Delai minimal entre deux requetes, en secondes.
# Le robots.txt de la cible declare « Crawl-delay: 10 » ; le collecteur releve
# de toute facon le delai au Crawl-delay, mais on l'inscrit ici pour que la
# configuration dise la verite sans dependre d'une lecture reseau.
delai_secondes = 10.0
# Une requete a la fois par defaut. Ne pas augmenter sans raison ecrite.
concurrence = 1
# Suivre les pages de detail en plus des pages de liste.
suivre_detail = true
# Points d'entree du parcours (numeros d'accession). Le front est amorce par
# ces graines puis etendu via les oeuvres liees de chaque fiche.
graines = ["1915.534", "1966.385", "1948.460", "1964.351", "1996.272"]

[http]
# User-Agent identifiant : on ne se fait pas passer pour un navigateur.
user_agent = "TP-Scraping-Collecteur/0.1 (formation Semifir; contact@example.org)"
timeout_secondes = 20.0
max_tentatives = 3
# Respecter Retry-After sur 429/503, plafonne a cette valeur.
backoff_max_secondes = 60.0

[sortie]
# Export JSONL : une ligne = un objet valide.
fichier_jsonl = "data/sortie.jsonl"
# Echantillon versionne de 5 a 10 objets, exige par l'enonce.
fichier_echantillon = "samples/sample_output.jsonl"
taille_echantillon = 10
# Objets rejetes, avec le motif. Sert a remplir la rubrique 7 du rapport.
fichier_rejets = "data/rejets.jsonl"

[journal]
# DEBUG, INFO, WARNING, ERROR
niveau = "INFO"
fichier = "logs/collecte.log"
